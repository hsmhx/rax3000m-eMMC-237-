name: RAX3000M ImmortalWrt 自动编译

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      skip_build:
        description: '跳过编译，仅测试环境'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10.git
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      if: github.event.inputs.skip_build != 'true'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget libfuse-dev ccache
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "GOPROXY=https://goproxy.cn,direct" >> $GITHUB_ENV
        echo "GOSUMDB=off" >> $GITHUB_ENV

    - name: 克隆源码
      if: github.event.inputs.skip_build != 'true'
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义配置
      if: github.event.inputs.skip_build != 'true'
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e .config ] && mv .config openwrt/.config
        chmod +x diy-part1.sh diy-part2.sh
        cd openwrt
        $GITHUB_WORKSPACE/diy-part1.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        $GITHUB_WORKSPACE/diy-part2.sh
        echo "===== 目标平台 ====="
        grep "CONFIG_TARGET_" .config | head -5

    - name: 编译主机工具（单线程，必须先做）
      if: github.event.inputs.skip_build != 'true'
      run: |
        cd openwrt
        make tools/install -j1 V=s

    - name: 下载软件包
      if: github.event.inputs.skip_build != 'true'
      run: |
        cd openwrt
        make download -j8 V=s
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译工具链（单线程）
      if: github.event.inputs.skip_build != 'true'
      run: |
        cd openwrt
        make toolchain/install -j1 V=s

    - name: 编译固件
      if: github.event.inputs.skip_build != 'true'
      run: |
        cd openwrt
        make -j$(nproc) V=s || make -j1 V=s
        echo "compile_status=success" >> $GITHUB_ENV

    - name: 整理固件
      if: env.compile_status == 'success'
      run: |
        cd openwrt
        mkdir -p output/firmware
        cp -f bin/targets/mediatek/filogic/*sysupgrade* output/firmware/ 2>/dev/null || true
        cp -f bin/targets/mediatek/filogic/*recovery* output/firmware/ 2>/dev/null || true
        cp -f bin/targets/mediatek/filogic/*emmc* output/firmware/ 2>/dev/null || true
        cd output && zip -r firmware.zip firmware/
        ls -lh firmware/

    - name: 上传到 Releases
      if: env.compile_status == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_id }}
        name: RAX3000M ImmortalWrt ${{ github.run_id }}
        files: openwrt/output/firmware/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传到 123 网盘
      if: env.compile_status == 'success'
      uses: baiyao105/123pan-uploader-action@v1
      with:
        auth-method: 'password'
        username: ${{ secrets.PAN123_USERNAME }}
        password: ${{ secrets.PAN123_PASSWORD }}
        path: 'openwrt/output/firmware'
        destination: 'RAX3000M-ImmortalWrt'
        conflict-strategy: 'overwrite'
