name: RAX3000M ImmortalWrt Auto Build

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日自动编译
  workflow_dispatch:       # 手动触发
  push:
    branches:
      - main

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10.git
  REPO_BRANCH: openwrt-24.10-6.6

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-pip rsync unzip zlib1g-dev file wget libfuse-dev ccache
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "GOPROXY=https://goproxy.cn,direct" >> $GITHUB_ENV
        echo "GOSUMDB=off" >> $GITHUB_ENV

    - name: Clone source
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom config
      run: |
        [ -e files ] && mv files openwrt/files
        chmod +x diy-part1.sh diy-part2.sh
        cd openwrt
        $GITHUB_WORKSPACE/diy-part1.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        $GITHUB_WORKSPACE/diy-part2.sh

    - name: Build firmware
      run: |
        cd openwrt
        # 跳过 prereq 检查
        mkdir -p tmp
        touch tmp/.prereq_packages
        # 创建 mkhash wrapper
        mkdir -p staging_dir/host/bin
        echo '#!/bin/bash' > staging_dir/host/bin/mkhash
        echo 'if [ "$1" = "sha256" ]; then shift; [ -n "$1" ] && sha256sum "$@" | awk "{print \$1}" || sha256sum | awk "{print \$1}"; fi' >> staging_dir/host/bin/mkhash
        echo 'if [ "$1" = "md5" ]; then shift; [ -n "$1" ] && md5sum "$@" | awk "{print \$1}" || md5sum | awk "{print \$1}"; fi' >> staging_dir/host/bin/mkhash
        chmod +x staging_dir/host/bin/mkhash
        # 链接系统工具
        for tool in gzip tar xz bzip2 cpio awk sed grep find gcc cc g++ cpp ld as ar ranlib nm strip objcopy objdump make cmake python3 perl; do
            [ -x "$(which $tool 2>/dev/null)" ] && [ ! -f "staging_dir/host/bin/$tool" ] && ln -sf "$(which $tool)" "staging_dir/host/bin/$tool"
        done
        # 开始编译
        make -j2 V=s
        echo "compile_status=success" >> $GITHUB_ENV

    - name: Organize firmware
      if: env.compile_status == 'success'
      run: |
        cd openwrt
        mkdir -p output/firmware
        cp -f bin/targets/mediatek/filogic/*sysupgrade* output/firmware/ 2>/dev/null || true
        cp -f bin/targets/mediatek/filogic/*initramfs* output/firmware/ 2>/dev/null || true
        cp -f bin/targets/mediatek/filogic/mt7981-*.bin output/firmware/ 2>/dev/null || true
        ls -lh output/firmware/

    - name: Upload to Releases
      if: env.compile_status == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_id }}
        name: RAX3000M 固件 ${{ github.run_id }}
        files: openwrt/output/firmware/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to 123Pan
      if: env.compile_status == 'success'
      uses: baiyao105/123pan-uploader-action@v1
      with:
        auth-method: 'password'
        username: ${{ secrets.PAN123_USERNAME }}
        password: ${{ secrets.PAN123_PASSWORD }}
        path: 'openwrt/output/firmware'
        destination: 'RAX3000M-ImmortalWrt'
        conflict-strategy: 'overwrite'
