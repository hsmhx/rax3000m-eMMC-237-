name: Build ImmortalWrt for RAX3000M

on:
  # 每天 UTC 0:00 检查源码更新（北京时间 8:00）
  schedule:
    - cron: '0 0 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送代码时触发
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'files/**'
      - '.config'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10.git
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  FILES: files
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        df -h

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib \
          g++-multilib gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
          file wget libfuse-dev ccache python3 python3-setuptools
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt
        cd openwrt
        echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check source update
      id: check_update
      run: |
        cd openwrt
        LATEST_COMMIT=$(git rev-parse HEAD)
        echo "Latest commit: $LATEST_COMMIT"
        # 读取上次编译的 commit
        LAST_COMMIT=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | grep -o '"tag_name": "[^"]*"' | head -1 | sed 's/"tag_name": "//;s/"//')
        echo "Last release commit: $LAST_COMMIT"
        if [ "$LATEST_COMMIT" = "$LAST_COMMIT" ] && [ "${{ github.event_name }}" = "schedule" ]; then
          echo "No source update, skip build."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "Need to build."
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Load custom feeds
      if: steps.check_update.outputs.skip != 'true'
      run: |
        cd openwrt
        if [ -f $GITHUB_WORKSPACE/$FEEDS_CONF ]; then
          cp $GITHUB_WORKSPACE/$FEEDS_CONF feeds.conf.default
        fi

    - name: Run DIY part 1
      if: steps.check_update.outputs.skip != 'true'
      run: |
        cd openwrt
        chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      if: steps.check_update.outputs.skip != 'true'
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      if: steps.check_update.outputs.skip != 'true'
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load custom configuration
      if: steps.check_update.outputs.skip != 'true'
      run: |
        cd openwrt
        cp -f defconfig/mt7981-ax3000.config .config
        if [ -f $GITHUB_WORKSPACE/$CONFIG_FILE ]; then
          cat $GITHUB_WORKSPACE/$CONFIG_FILE >> .config
        fi
        if [ -d $GITHUB_WORKSPACE/$FILES ]; then
          cp -r $GITHUB_WORKSPACE/$FILES/* files/
        fi

    - name: Generate config
      if: steps.check_update.outputs.skip != 'true'
      run: |
        cd openwrt
        make defconfig

    - name: Download packages
      if: steps.check_update.outputs.skip != 'true'
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      if: steps.check_update.outputs.skip != 'true'
      run: |
        cd openwrt
        # 跳过 prereq 检查
        mkdir -p tmp
        touch tmp/.prereq_packages
        # 开始编译
        make -j2 V=s
        echo "BUILD_STATUS=success" >> $GITHUB_ENV

    - name: Run DIY part 2
      if: steps.check_update.outputs.skip != 'true' && env.BUILD_STATUS == 'success'
      run: |
        cd openwrt
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Organize files
      if: steps.check_update.outputs.skip != 'true' && env.BUILD_STATUS == 'success'
      run: |
        cd openwrt
        mkdir -p output
        cp bin/targets/mediatek/filogic/*sysupgrade*.bin output/ 2>/dev/null || true
        cp bin/targets/mediatek/filogic/*initramfs*.bin output/ 2>/dev/null || true
        cp bin/targets/mediatek/filogic/mt7981-*.bin output/ 2>/dev/null || true
        cd output && sha256sum * > sha256sums.txt
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload to Release
      if: steps.check_update.outputs.skip != 'true' && env.BUILD_STATUS == 'success' && env.UPLOAD_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.SOURCE_COMMIT }}
        name: ImmortalWrt RAX3000M ${{ env.SOURCE_COMMIT }}
        body: |
          ## 编译信息
          - 源码：padavanonly/immortalwrt-mt798x-24.10
          - 分支：openwrt-24.10-6.6
          - Commit：${{ env.SOURCE_COMMIT }}
          - 设备：CMCC RAX3000M eMMC
          - 编译时间：${{ github.run_started_at }}
          
          ## 包含插件
          - LuCI 中文界面
          - argon 主题
          - iStore 商店
          - qmodem 5G 管理
          - 磁盘管理
          - 手机 USB 共享
          - MTK 硬件加速
        files: |
          output/*.bin
          output/sha256sums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build notification
      if: always()
      run: |
        if [ "${{ env.BUILD_STATUS }}" = "success" ]; then
          echo "✅ 编译成功！固件已上传到 Releases。"
          echo "下载地址：https://github.com/${{ github.repository }}/releases/tag/${{ env.SOURCE_COMMIT }}"
        elif [ "${{ steps.check_update.outputs.skip }}" = "true" ]; then
          echo "⏭️ 源码无更新，跳过编译。"
        else
          echo "❌ 编译失败，请查看日志。"
        fi
